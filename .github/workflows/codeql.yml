# Analyse de sécurité du code (CodeQL) : à chaque push, pull request et chaque semaine.
# Résultats : onglet Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none # analyse du source, sans compiler (WinForms ne se compile que sous Windows)
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
