# Publie une release à chaque tag vX.Y.Z :
#   git tag v1.1.0
#   git push origin v1.1.0
# Les installations existantes de Corral la proposeront ensuite automatiquement.
# Secret requis : CORRAL_SIGNING_KEY (clé privée PEM, voir tools/UpdateSigner) pour signer la mise à jour.
# Fichiers : Corral.exe / Corral.msi (x64, noms historiques) et Corral-arm64.exe / Corral-arm64.msi (voir Updater.Assets).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write      # attestations de build
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test -c Release

      - name: Publication
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish src/Corral -c Release -r win-$arch --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=$version -p:UpdateRepository=${{ github.repository }} `
              -o publish/$arch
            if ($LASTEXITCODE -ne 0) { throw "Échec de la publication $arch" }
            $name = if ($arch -eq 'arm64') { 'Corral-arm64' } else { 'Corral' }
            Copy-Item publish/$arch/Corral.exe out/$name.exe
          }

      - name: Installeurs MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          foreach ($arch in 'x64', 'arm64') {
            $name = if ($arch -eq 'arm64') { 'Corral-arm64' } else { 'Corral' }
            wix build packaging/Corral.wxs -arch $arch -ext WixToolset.Util.wixext `
              -d Version=$version -d ExePath=out/$name.exe -o out/$name.msi
            if ($LASTEXITCODE -ne 0) { throw "Échec de la compilation du MSI $arch" }
            # ICE43/ICE57 : faux positifs des paquets « par machine » (raccourci du menu Démarrer commun) ;
            # ICE61 : réinstaller la même version remplace l'installation (AllowSameVersionUpgrades)
            wix msi validate -sice ICE43 -sice ICE57 -sice ICE61 out/$name.msi
            if ($LASTEXITCODE -ne 0) { throw "MSI $arch invalide" }
          }
          Remove-Item out/*.wixpdb -ErrorAction SilentlyContinue
          # Modèles de stratégie de groupe
          Compress-Archive -Path packaging/policies/* -DestinationPath out/Corral-ADMX.zip

      - name: Sommes de contrôle et signatures
        shell: pwsh
        env:
          CORRAL_SIGNING_KEY: ${{ secrets.CORRAL_SIGNING_KEY }}
        run: |
          dotnet build tools/UpdateSigner -c Release -o signer
          foreach ($file in Get-ChildItem out -Include *.exe, *.msi -Recurse) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File "$file.sha256" -Encoding ascii -NoNewline
            # Les installations n'acceptent que les fichiers signés par cette clé (voir Updater.VerifySignature)
            $out = dotnet signer/UpdateSigner.dll sign $file "$file.sig"
            if ($LASTEXITCODE -ne 0) { throw "Signature impossible (secret CORRAL_SIGNING_KEY manquant ?)" }
            $public = ($out | Select-String 'PublicKey: (\S+)').Matches[0].Groups[1].Value
            if (-not (Select-String -Path src/Corral/Core/Updater.cs -SimpleMatch "`"$public`"" -Quiet)) {
              throw "La clé du secret ne correspond pas à Updater.PublicKey"
            }
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/*.exe
            out/*.msi

      - name: Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: out/*
