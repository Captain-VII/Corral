# Publie une release à chaque tag vX.Y.Z :
#   git tag v1.1.0
#   git push origin v1.1.0
# Les installations existantes de Corral la proposeront ensuite automatiquement.
# Secret requis : CORRAL_SIGNING_KEY (clé privée PEM, voir tools/UpdateSigner) pour signer la mise à jour.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write      # attestations de build
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test -c Release

      - name: Publication
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Corral -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -p:UpdateRepository=${{ github.repository }} `
            -o publish
          $hash = (Get-FileHash publish/Corral.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Corral.exe" | Out-File publish/Corral.exe.sha256 -Encoding ascii -NoNewline

      - name: Signature de la mise à jour
        shell: pwsh
        env:
          CORRAL_SIGNING_KEY: ${{ secrets.CORRAL_SIGNING_KEY }}
        run: |
          $out = dotnet run --project tools/UpdateSigner -c Release -- sign publish/Corral.exe publish/Corral.exe.sig
          if ($LASTEXITCODE -ne 0) { throw "Signature impossible (secret CORRAL_SIGNING_KEY manquant ?)" }
          $out
          # La clé du secret doit correspondre à celle que les installations vérifient
          $public = ($out | Select-String 'PublicKey: (\S+)').Matches[0].Groups[1].Value
          if (-not (Select-String -Path src/Corral/Core/Updater.cs -SimpleMatch "`"$public`"" -Quiet)) {
            throw "La clé du secret ne correspond pas à Updater.PublicKey"
          }

      - name: Installeur MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build packaging/Corral.wxs -arch x64 -ext WixToolset.Util.wixext `
            -d Version=$version -d ExePath=publish/Corral.exe -o publish/Corral.msi
          if ($LASTEXITCODE -ne 0) { throw "Échec de la compilation du MSI" }
          # ICE43/ICE57 : faux positifs des paquets « par machine » (raccourci du menu Démarrer commun) ;
          # ICE61 : réinstaller la même version remplace l'installation (AllowSameVersionUpgrades)
          wix msi validate -sice ICE43 -sice ICE57 -sice ICE61 publish/Corral.msi
          if ($LASTEXITCODE -ne 0) { throw "MSI invalide" }
          $hash = (Get-FileHash publish/Corral.msi -Algorithm SHA256).Hash.ToLower()
          "$hash  Corral.msi" | Out-File publish/Corral.msi.sha256 -Encoding ascii -NoNewline
          # Modèles de stratégie de groupe
          Compress-Archive -Path packaging/policies/* -DestinationPath publish/Corral-ADMX.zip

      - name: Signature de l'installeur
        shell: pwsh
        env:
          CORRAL_SIGNING_KEY: ${{ secrets.CORRAL_SIGNING_KEY }}
        run: |
          # Le service n'installe que des MSI signés par cette clé (voir Updater.DownloadMsiAsync)
          dotnet run --project tools/UpdateSigner -c Release -- sign publish/Corral.msi publish/Corral.msi.sig
          if ($LASTEXITCODE -ne 0) { throw "Signature du MSI impossible" }

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            publish/Corral.exe
            publish/Corral.msi

      - name: Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            publish/Corral.exe
            publish/Corral.exe.sha256
            publish/Corral.exe.sig
            publish/Corral.msi
            publish/Corral.msi.sha256
            publish/Corral.msi.sig
            publish/Corral-ADMX.zip
